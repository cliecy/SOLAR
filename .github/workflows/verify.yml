name: verify-release
on: [push, pull_request]
# Fixed commands only; no event payload is interpolated into the shell.
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-replay.txt
      - run: python scripts/verify_release.py --output rebuilt
      - name: Replay four-experiment follow-up and frozen450 controls
        working-directory: experiments/four405
        run: |
          python -m pip install -r requirements.txt
          python replay.py --root .
          python scripts/replay_old450.py --inputs evidence/old450 --output replayed-old450
          python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-results
          path: rebuilt/
