name: verify-release
on: [push, pull_request]
# Fixed commands only; no event payload is interpolated into the shell.
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-replay.txt
      - run: python -m unittest discover -s tests -p test_revision_ledger.py -v
      - run: python scripts/verify_release.py --output rebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-results
          path: rebuilt/
